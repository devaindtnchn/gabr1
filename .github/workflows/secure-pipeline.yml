name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:
  
jobs:
  build_and_package:
    name: BUILD-JOB
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: BUILD
        run: |
          npm cache clean --force
          npm ci

      - name: TEST
        run: echo "code is tested!"
      
      - name: Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-1
          path: |
            package*
          retention-days: 7
